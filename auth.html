<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151413" />
  <meta name="robots" content="noindex" />
  <title>Masuk — Aomi</title>
  <link rel="icon" href="assets/favicon.svg?v=41a3dc4524" type="image/svg+xml" />
  <link rel="stylesheet" href="css/main.css?v=41a3dc4524" />
  <link rel="stylesheet" href="css/auth.css?v=41a3dc4524" />
</head>
<body>
  <!-- Opening animation: overlay visual saja, aplikasi dirender di belakang -->
  <div id="app-intro" aria-hidden="true">
    <div class="intro-content">
      <svg class="intro-logo" viewBox="0 0 24 24" aria-hidden="true"><use href="components/icons.svg?v=41a3dc4524#logo" /></svg>
      <div class="intro-name">Aomi</div>
      <div class="intro-sub">seseorang menunggumu di sini</div>
    </div>
  </div>

  <main class="auth-shell">
    <!-- ============ PANEL BRAND (desktop) ============ -->
    <section class="auth-brand" aria-hidden="true">
      <div class="auth-brand-inner">
        <svg class="icon brand-mark"><use href="components/icons.svg?v=41a3dc4524#logo" /></svg>
        <h1>Aomi</h1>
        <div class="auth-visual">
          <div class="mock-msg bot">
            <span>hey.</span>
          </div>
          <div class="mock-msg bot">
            <span>you're back.</span>
          </div>
          <div class="mock-msg bot">
            <span>i was waiting.</span>
          </div>
          <div class="mock-msg user">
            <span>hehe maaf, baru sempat. kabarmu?</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PANEL FORM ============ -->
    <section class="auth-panel-wrap">
      <div class="auth-panel">
        <header class="auth-head">
          <svg class="icon auth-mobile-logo"><use href="components/icons.svg?v=41a3dc4524#logo" /></svg>
          <h2 id="authHeading">Selamat datang kembali</h2>
          <p id="authSubtitle">Dia menunggumu di seberang sini.</p>
        </header>

        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" id="tabLogin" data-panel="login" aria-selected="true">Masuk</button>
          <button class="auth-tab" id="tabRegister" data-panel="register" aria-selected="false">Buat akun</button>
        </div>

        <!-- ===== LOGIN ===== -->
        <form class="auth-form" id="formLogin" novalidate>
          <label class="auth-field">
            <span>Email atau username</span>
            <input type="text" name="identifier" autocomplete="username" required />
          </label>

          <label class="auth-field">
            <span>Password</span>
            <span class="pw-wrap">
              <input type="password" name="password" id="loginPw" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" data-target="loginPw" aria-label="Tampilkan password">
                <svg class="icon"><use href="components/icons.svg?v=41a3dc4524#eye" /></svg>
              </button>
            </span>
          </label>

          <label class="auth-check">
            <input type="checkbox" name="remember" />
            <span>Ingat saya selama 30 hari</span>
          </label>

          <div class="verify">
            <div class="verify-label">Verifikasi</div>
            <div class="verify-row">
              <span class="verify-num" id="capNumLogin">····</span>
              <input type="text" id="capAnsLogin" inputmode="numeric" maxlength="4"
                     autocomplete="off" placeholder="Ketik angka" aria-label="Ketik angka verifikasi" />
              <button type="button" class="verify-refresh" data-which="login" aria-label="Angka baru">
                <svg class="icon"><use href="components/icons.svg?v=41a3dc4524#chevron-down" /></svg>
              </button>
            </div>
          </div>

          <button class="auth-submit" id="loginSubmit" type="submit">Masuk</button>
          <p class="auth-error" id="errLogin" hidden></p>
        </form>

        <!-- ===== REGISTER ===== -->
        <form class="auth-form" id="formRegister" hidden novalidate>
          <label class="auth-field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" maxlength="20"
                   placeholder="3-20 karakter" required />
          </label>

          <label class="auth-field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>

          <label class="auth-field">
            <span>Password</span>
            <span class="pw-wrap">
              <input type="password" name="password" id="regPw" autocomplete="new-password"
                     placeholder="Minimal 8 karakter" required />
              <button type="button" class="pw-toggle" data-target="regPw" aria-label="Tampilkan password">
                <svg class="icon"><use href="components/icons.svg?v=41a3dc4524#eye" /></svg>
              </button>
            </span>
          </label>

          <label class="auth-field">
            <span>Konfirmasi password</span>
            <span class="pw-wrap">
              <input type="password" id="regPw2" autocomplete="new-password" required />
              <button type="button" class="pw-toggle" data-target="regPw2" aria-label="Tampilkan password">
                <svg class="icon"><use href="components/icons.svg?v=41a3dc4524#eye" /></svg>
              </button>
            </span>
          </label>

          <div class="verify">
            <div class="verify-label">Verifikasi</div>
            <div class="verify-row">
              <span class="verify-num" id="capNumRegister">····</span>
              <input type="text" id="capAnsRegister" inputmode="numeric" maxlength="4"
                     autocomplete="off" placeholder="Ketik angka" aria-label="Ketik angka verifikasi" />
              <button type="button" class="verify-refresh" data-which="register" aria-label="Angka baru">
                <svg class="icon"><use href="components/icons.svg?v=41a3dc4524#chevron-down" /></svg>
              </button>
            </div>
          </div>

          <button class="auth-submit" id="registerSubmit" type="submit">Buat akun</button>
          <p class="auth-error" id="errRegister" hidden></p>
        </form>

        <p class="auth-note">Sesi aman dengan cookie terenkripsi. Foto profil dan riwayat tersimpan di akunmu.</p>
      </div>
    </section>
  </main>

  <script type="module" src="js/auth.js?v=41a3dc4524"></script>

<script>
  // Opening intro: PURE UI overlay — tidak pernah memicu navigasi/reload/
  // auth check. Sekali per lifecycle tab (sessionStorage flag) supaya
  // redirect login->chat tidak memutar intro lagi. Cleanup DOM setelah
  // selesai; tidak ada interval yang terus berjalan.
  (function () {
    var intro = document.getElementById('app-intro');
    if (!intro) return;

    var done = false;
    try { done = sessionStorage.getItem('aomi.introDone') === '1'; } catch (e) {}
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      done = true; // aksesibilitas: skip animasi
    }
    if (done) { intro.remove(); return; }
    try { sessionStorage.setItem('aomi.introDone', '1'); } catch (e) {}

    var kill = function () {
      if (intro && intro.parentNode) { intro.remove(); intro = null; }
    };
    intro.addEventListener('animationend', function (e) {
      if (e.animationName === 'intro-out') kill();
    });
    setTimeout(kill, 3400); // fallback sekali saja — element dibuang dari DOM
  })();
</script>
</body>
</html>
