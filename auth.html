<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141417" />
  <meta name="robots" content="noindex" />
  <title>Masuk — Aomi</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="authHeading">
      <header class="auth-head">
        <svg class="icon brand-icon" aria-hidden="true"><use href="components/icons.svg#logo" /></svg>
        <h1 id="authHeading">Aomi</h1>
        <p id="authSubtitle">Masuk untuk melanjutkan percakapanmu.</p>
      </header>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tabLogin" role="tab" aria-selected="true" data-panel="login">Masuk</button>
        <button class="auth-tab" id="tabRegister" role="tab" aria-selected="false" data-panel="register">Daftar</button>
      </div>

      <!-- ============ LOGIN ============ -->
      <form class="auth-panel" id="formLogin" data-panel-body="login" novalidate>
        <label class="field">
          <span>Email atau username</span>
          <input type="text" name="identifier" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <label class="check">
          <input type="checkbox" name="remember" />
          <span>Ingat saya (30 hari)</span>
        </label>

        <div class="captcha-row">
          <span id="captchaQLogin" class="captcha-q">Memuat soal…</span>
          <input type="text" id="captchaALogin" inputmode="numeric" autocomplete="off"
                 placeholder="Jawaban" aria-label="Jawaban verifikasi" />
          <button type="button" class="captcha-refresh" id="refreshLogin" aria-label="Soal baru">
            <svg class="icon" aria-hidden="true"><use href="components/icons.svg#chevron-down" /></svg>
          </button>
        </div>

        <button class="auth-submit" type="submit">Masuk</button>
        <p class="auth-error" id="errLogin" hidden></p>
      </form>

      <!-- ============ REGISTER ============ -->
      <form class="auth-panel" id="formRegister" data-panel-body="register" hidden novalidate>
        <label class="field">
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" maxlength="20"
                 placeholder="3-20 karakter" required />
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="new-password"
                 placeholder="Minimal 8 karakter" required />
        </label>

        <div class="captcha-row">
          <span id="captchaQRegister" class="captcha-q">Memuat soal…</span>
          <input type="text" id="captchaARegister" inputmode="numeric" autocomplete="off"
                 placeholder="Jawaban" aria-label="Jawaban verifikasi" />
          <button type="button" class="captcha-refresh" id="refreshRegister" aria-label="Soal baru">
            <svg class="icon" aria-hidden="true"><use href="components/icons.svg#chevron-down" /></svg>
          </button>
        </div>

        <button class="auth-submit" type="submit">Buat akun</button>
        <p class="auth-error" id="errRegister" hidden></p>
      </form>

      <p class="auth-note">Verifikasi manusia tidak mengirim data ke layanan luar.</p>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
